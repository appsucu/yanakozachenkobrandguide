schema: spec-driven

context: |
  Проєкт: Yana Kozachenko — Visual Guide & Color Studio (appsucu/yanakozachenkobrandguide).
  Призначення: інтерактивний візуальний брендбук, студія підбору та перевірки контрасту кольорів (WCAG), демонстрація сітки Instagram 3x3 та правил публікації.
  Технічний стек: семантичний HTML5, модульний CSS (Custom Properties, Grid, Flexbox), чистий Vanilla JavaScript (ES6+ модулі в js/), локальний сервер швидкого оновлення dev.py (SSE Live Reload на стандартній бібліотеці Python 3), GitHub Actions + GitHub Pages (публікація з кореня репозиторію).
  Архітектурні обмеження: сайт працює автономно в браузері без npm-пакетів та збирачів. Збереження сценаріїв кольорів у localStorage (yk-colors). Тексти та інтерфейс — українською мовою.

rules:
  proposal:
    - "Завжди перевіряти, які файли зачіпаються (index.html, js/ або css/)"
    - "Обов'язково враховувати адаптивність для мобільних пристроїв та контрастність за стандартом WCAG AA"
  specs:
    - "Використовувати чіткі нормативні формулювання (SHALL, MUST)"
    - "Кожна вимога повинна містити сценарії з кроками WHEN та THEN"
    - "Опис кожної вимоги формулювати стисло (до 500 символів)"
  tasks:
    - "Включати синтаксичну перевірку: node --check app.js js/*.js та python3 -m py_compile dev.py"
    - "Перевіряти коректність роботи перемикання форматів (4:5 / 9:16), копіювання в буфер обміну та збереження в localStorage"
    - "Валідувати зміни через openspec validate --specs"

operations:
  apply:
    guidance:
      - "Перевіряти адаптивне відображення всіх 6 секцій сайту"
      - "Тестувати інтерактивну майстерню у форматах пост та сторіз"
  archive:
    guidance:
      - "Підсумовувати стан оновлених специфікацій"
